{{- if .Values.dashboard }}
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  labels:
    {{- include "enschedule.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.singlePod.enabled }}
    - port: {{ .Values.database.service.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
    {{- end }}
  selector:
    app.kubernetes.io/name: {{ ternary "enschedule" "dashboard" .Values.singlePod.enabled }}
{{- end }}
