name: alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: NODE_ENV=production bun run build
      - run: bun run --cwd website openapi:generate
      - run: git diff --exit-code -- website/openapi.json
      - run: bun run --cwd website links
      - run: bun run --cwd website a11y
      - run: bun x playwright install chromium --with-deps
      - run: bun run playwright -- test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: helm lint infrastructure/charts/enschedule
      - run: docker build --target worker -t enschedule-worker:ci .
      - run: docker build --target dashboard -t enschedule-dashboard:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
